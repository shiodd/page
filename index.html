<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shion</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        })();
    </script>
</head>
<body>

    <!-- 首页 -->
    <div class="main-wrap">
        <div class="profile-side"></div>
        <div class="content-side">
            <div class="home-center">
            <h1 class="home-name">Shion</h1>
            <p class="home-sub"><span class="gradient-text">輝き</span>の向こう側へ！</p>

            <div class="busuanzi-stats">
                <p>您是第<span id="busuanzi_site_uv"></span>个访问本站的P</p>
            </div>
            <script>
                (function () {
                    var s = document.createElement('script');
                    s.src = 'https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js';
                    s.async = true;
                    var done = false;
                    s.onload = function () { done = true; };
                    s.onerror = function () { showPlaceholder(); };
                    document.head.appendChild(s);
                    setTimeout(function () {
                        if (!done) showPlaceholder();
                    }, 3000);
                    function showPlaceholder() {
                        var el = document.getElementById('busuanzi_site_uv');
                        if (el && !el.textContent.trim()) {
                            el.textContent = '--';
                        }
                    }
                })();
            </script>

        </div>
        </div>
    </div>

    <footer class="footer" id="contact">
    </footer>

    <script src="js/script.js"></script>
    <script>

        (function () {
            var el = document.querySelector('.gradient-text');
            if (!el || typeof NAV_COLORS === 'undefined' || !NAV_COLORS.length) return;

            var homeColor = NAV_COLORS[0];
            el.style.color = homeColor;

            var seq = NAV_COLORS.slice().concat([homeColor]);

            var n = seq.length - 1;             // 颜色段数
            var step = 100 / n;                 // 每段占的时间百分比
            var css = '@keyframes themeColorShift {\n';
            seq.forEach(function (c, i) {
                var pct = (i * step).toFixed(2);
                css += '  ' + pct + '% { color: ' + c + '; -webkit-text-fill-color: ' + c + '; }\n';
            });
            css += '}\n';

            var style = document.createElement('style');
            style.textContent = css;
            document.head.appendChild(style);
        })();
    </script>
</body>
</html>
